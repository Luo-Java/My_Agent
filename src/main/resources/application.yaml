spring:
  application:
    name: My_Agent

  # 独立提示词(prompts.yaml) + 本地私有配置(application-local.yaml，含口令与 API Key，已 gitignore)
  config:
    import: classpath:prompts.yaml, optional:file:./application-local.yaml, optional:file:./config/application-local.yaml

  # DDL 由人工在 mysql cli 执行 sql/schema.sql(建表)与 alter.sql(补列)；需自动建表时取消下面注释
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:sql/schema.sql,classpath:sql/alter.sql
#      continue-on-error: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB

  # 静态资源禁用浏览器缓存，否则改完前端需 Ctrl+F5 才生效；生产开缓存时删掉本段
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

  datasource:
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    # 口令由 application-local.yaml 或环境变量 DB_PASSWORD 注入，不进仓库
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      # API Key 由 application-local.yaml 或环境变量 OPENAI_API_KEY 注入，不进仓库
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      timeout: 60s
      max-retries: 1
      chat:
        model: qwen3.7-flash-2026-07-15
      # RAG 向量化，与 chat 共用 api-key/base-url；换模型会使已入库向量失效，需重传或 rechunk
      embedding:
        model: qwen3.7-text-embedding

    # MCP 客户端(官方 starter)：这里不声明任何 server，默认即不接入。
    # 要接 server 把连接配置写进 application-local.yaml(已 gitignore)；命令用绝对路径，禁用 npx。
    mcp:
      client:
        enabled: true
        name: my-agent
        version: 1.0.0
        type: sync
        request-timeout: 15s
        toolcallback:
          enabled: true
        # stdio:
        #   connections:
        #     <server 名>:
        #       command: <可执行文件绝对路径>
        #       args: [<server 入口 js>, <沙箱根目录>]

# 智能体平台自身配置。前缀必须是顶层 agent.*(@ConfigurationProperties)，历史上曾缩进错挂到 spring.agent.* 整段失效
agent:
  # 多模态视觉识别：图片转 caption 注入对话。model 未配置时回退 VisionProperties.DEFAULT_MODEL
  vision:
    model: qwen-image-2.0-pro-2026-06-22
    max-image-bytes: 10485760   # 单图上限，超出返回「图片过大」占位
    timeout-seconds: 30

  # 会话记忆窗口(MemoryProperties)
  memory:
    recent-tokens: 4000       # 原文预算(按字符数近似)，超出由滚动摘要接管
    min-keep-messages: 2      # 至少保留的最近消息条数，防历史窗口塌缩变空(0=关闭)
    max-message-chars: 4000   # 单条消息进上下文前的字符上限，超出截断(0=不截断)

  # 规划步骤间产物传递(PlannerProperties)：给「前驱产出拼进下一步」装上限，防多步长产出无界累积击穿上下文
  # 实际配额 = min(upstream-max-chars, upstream-total-chars / 前驱个数)；两个都必须为正(不支持关闭)
  # 截断会保留前段并追加省略标注 + WARN，不静默；只影响注入下一步的输入，不影响落库与最终回复
  planner:
    upstream-max-chars: 4000     # 单个前驱产出注入下一步的字符上限
    upstream-total-chars: 12000  # 全部前驱产出合计上限，按前驱个数均分
    isolate-middle-steps: true   # 中间步骤(非首层非末步)不注入长期记忆(core_facts/summary)，避免被别的话题的摘要带偏

  # 提示词回归评测(EvalProperties)：跑固定用例集断言路由/规划决策，改完 prompts.yaml 跑一批并和上一批对比
  # 用例集位置用 Spring Resource 语法；想免重编译调试可改成 file:./eval-cases.yaml
  eval:
    cases-file: classpath:eval-cases.yaml
    timeout-seconds: 60         # 单用例超时，超时记该条失败而不拖垮整批(被测调用自身没有 per-request 超时)

  # 工具循环控制(ToolCallProperties)：给 Spring AI 默认无限工具循环装刹车，防死循环/重复调用拖垮 token
  tool-call:
    max-iterations: 10        # 模型往返轮数硬顶，覆盖「查表→查数→画图」这类合理长链，只兜底真死循环
    repeat-threshold: 3       # 连续 N 次调同名工具同参即判原地打转、软刹车(基于已有信息作答)

  # RAG 检索与精排(RagProperties)：粗排召回→精排→编号注入。精排走 DashScope 原生 text-rerank，复用 openai.api-key
  rag:
    rerank-enabled: true
    rerank-model: gte-rerank-v2
    rerank-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    rerank-min-score: 0.20    # 精排相关度下限(0~1)
    recall-k: 20              # 粗排召回候选数
    top-k: 3                  # 注入提示词的资料条数
    recall-min-score: 0.10    # 召回向量余弦下限(放宽档)
    min-score: 0.25           # 精排不可用时的余弦下限(严格档)
    timeout-seconds: 5
    fallback-max-chunks: 2000 # Chroma 不可用时回退 MySQL 的扫描上限，防无界扫描 OOM
    query-rewrite-enabled: true
    query-rewrite-history-size: 6   # 参与指代消解的历史条数上限

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Chroma 向量库(加速副本，MySQL 双写；不可用时降级 MySQL 余弦检索)
chroma:
  base-url: http://127.0.0.1:8000
  collection-name: kb_chunks
  # 必须用 Chroma 原生命名空间；Spring AI 默认的 SpringAiTenant 在本地 0.5.x 不存在，会导致初始化必失败
  tenant: default_tenant
  database: default_database
  retry-interval-seconds: 60   # 连接失败后的重试冷却，先起应用后起 Chroma 可自愈
  upsert-batch-size: 10        # 单批写入条数，受 embedding 模型单次批量上限约束(留一倍余量)

# 接口访问控制：登录鉴权是全项目唯一的接口闸门
#   jwt —— 用户登录态，/api/** 除 /api/auth/login 外都要带 Authorization: Bearer <token>
# 旧的服务级密钥（app.api-key / APP_API_KEY → ApiKeyInterceptor）已移除：它与登录流程冲突 ——
# 启用后连 POST /api/auth/login 都会被拒（前端登录请求只带 Authorization，不带 X-Api-Key），
# 用户根本进不来；而 /api/** 已由 JWT 覆盖，机器调用同样需要先登录，该闸门不再提供额外保护。
app:
  jwt:
    enabled: true            # 强制登录；置 false 则 /api/** 不再校验 token（回到引入用户系统前的行为）
    # 签名密钥不进仓库：用环境变量 JWT_SECRET 注入（如 openssl rand -hex 32）。
    # 留空或不足 32 字节时启动生成随机密钥并打 WARN —— 仅够本地开发，重启后所有已签发 token 失效。
    secret: ${JWT_SECRET:457a37ff516ef1cd2100ea1573063358ab578395b7515b252c14eaa71bbd0d74}
    expire-minutes: 720      # token 有效期（分钟）
    issuer: my-agent
    bootstrap-admin: true    # 启动时若 sys_user 表为空则创建初始管理员（否则首次无法登录）
    bootstrap-username: admin
    bootstrap-password: ${JWT_BOOTSTRAP_PASSWORD:admin123}   # 仅初始口令，登录后应立即修改
  sse:
    timeout-seconds: 300     # 单条 SSE 连接最长存活(0=永不超时，会泄漏)
    heartbeat-seconds: 15    # 心跳间隔，防反向代理 60s 空闲断连(0=关闭)
  attachment:
    dir: ./data/attachments  # 附件落盘目录，生产建议指向固定数据盘

server:
  port: 8080

logging:
  level:
    root: info
    org.luo: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
