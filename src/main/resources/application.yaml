spring:
  application:
    name: My_Agent

  # 导入独立提示词配置（agent.prompt.*，见 resources/prompts.yaml）+ 本地私有配置
  # （application-local.yaml，含数据库口令与模型 API Key；该文件已被 .gitignore 排除）。
  # 本地私有配置用 optional: 引入 —— 文件不存在也不报错，部署时可改用环境变量
  # （DB_PASSWORD / OPENAI_API_KEY，优先级高于任何配置文件）。
  config:
    import: classpath:prompts.yaml, optional:file:./application-local.yaml, optional:file:./config/application-local.yaml

  # 建表脚本默认【不自动执行】（下方 sql.init 整段处于注释状态）：DDL 由人工在 mysql 客户端
  # 手动执行 src/main/resources/sql/schema.sql（建表）与 alter.sql（存量库补列）。
  # 如需应用启动时自动建表，取消下面注释即可 —— schema.sql 幂等（CREATE TABLE IF NOT EXISTS），
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:sql/schema.sql,classpath:sql/alter.sql
#      continue-on-error: true

  # 文件上传上限。单文件给到 20MB 留余量（覆盖前端 15MB 的限额），
  # 请求总量 80MB 覆盖 5 个满额附件。超限由 GlobalExceptionHandler 转成 413 友好提示，不再裸 500。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB

  datasource:
    # 库名 agent 必须【事先手动创建】：连接串未带 createDatabaseIfNotExist，不会自动建库。
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    # 口令不进仓库：由 application-local.yaml 提供，或用环境变量 DB_PASSWORD 注入。
    # spring.config.import 引入的 application-local.yaml，留一个空值反而会把本地口令覆盖成空串。
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      # API Key 不进仓库：由 application-local.yaml 提供，或用环境变量 OPENAI_API_KEY 注入。
      # 使用 DeepSeek / 通义千问 / 本地 Ollama 等兼容服务时，改成对应地址即可，
      # 例如 DeepSeek: https://api.deepseek.com   本地 Ollama: http://localhost:11434
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # Spring AI 默认 timeout=60s、max-retries=3：重试会放大失败代价，一次持续 429/5xx 最多尝试 4 次，
      # 故这里收紧到 max-retries=1。
      # 注：OpenAiChatOptions 虽有 timeout 字段，但 OpenAiChatModel 全文未引用它（死字段），
      timeout: 60s
      max-retries: 1
      chat:
        # 主对话模型 ID（OpenAI 兼容服务下的模型名，如 gpt-4o-mini / deepseek-chat / qwen3.7-plus）。
        model: kimi-k2.7-code
      # 知识库（RAG）向量化：与 chat 共用上方的 api-key / base-url（OpenAI 兼容的 /embeddings 端点）。
      embedding:
        # 换模型会使已入库向量失效（维度 / 语义空间不同），需重传文件或 rechunk 重建。
        model: qwen3.7-text-embedding

# 智能体平台自身配置。
# 前缀必须是【顶层 agent.*】，与代码里的 @ConfigurationProperties("agent.*") 对应。
# 历史上曾因缩进错误被挂到 spring: 下（实际键变成 spring.agent.*）而整段静默失效，改动务必核对缩进。
agent:
  # 多模态视觉识别：图片由 VisionService 转文本 caption 后注入对话上下文。
  # 整段被注释 = 全部使用 VisionProperties 的默认值（model=qwen3.5-ocr / 单图 10MB / 超时 30s）。
  # 需要覆盖时取消注释；model 填 dashscope OpenAI 兼容接口支持的视觉模型（qwen3.5-ocr / qwen-vl-plus 等）。
  # vision:
  #   model: qwen3.5-ocr
  #   max-image-bytes: 10485760   # 单图 10MB 上限，超出返回「图片过大」占位
  #   timeout-seconds: 30

  # 会话记忆窗口（见 MemoryProperties / DbChatMemory）
  memory:
    recent-tokens: 4000       # 维持上下文的原文预算（按字符数近似）；超出部分由滚动摘要接管
    min-keep-messages: 2      # 窗口「至少」保留的最近消息条数（防塌缩下限，0=关闭）。
                              # 单条消息自己超预算时，缺这条下限会让整个历史窗口变空（模型「突然失忆」）
    max-message-chars: 4000   # 单条消息进上下文前的字符上限，超出截断并标注（0=不截断）

  # RAG 检索与精排（见 RagProperties）。三段式：粗排召回 → 精排 → 编号注入。
  # 精排走 DashScope 原生 text-rerank（不在 OpenAI 兼容路径下），复用 spring.ai.openai.api-key；
  # 未配置 key / 超时 / 报错时自动降级为「按向量分截断」，对话不受影响。
  rag:
    rerank-enabled: true
    rerank-model: gte-rerank-v2
    rerank-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    rerank-min-score: 0.20    # 精排相关度下限（0~1），低于此值的候选丢弃
    recall-k: 20              # 粗排召回候选数（交给精排的量）
    top-k: 3                  # 最终注入提示词的资料条数
    recall-min-score: 0.10    # 召回阶段的向量余弦下限（放宽用）
    min-score: 0.25           # 精排不可用时沿用的向量余弦下限（严格档）
    timeout-seconds: 5
    # Chroma 不可用时回退 MySQL 余弦检索的扫描上限。MySQL 里向量以 JSON 文本存储，
    # 无界扫描会把整库向量读进堆（OOM 隐患）。超限会打 warn（含真实总数），命中可能不完整。
    fallback-max-chunks: 2000
    # 多轮查询改写（指代消解）：检索前用最近若干轮历史把追问补全为自包含问题。
    # 精排只能重排已召回的候选，query 本身指代不清时正确答案压根召不回来，故改写是精排的前置。
    # 首轮无历史 / 会话未开 RAG 时自动跳过，不产生额外模型调用。
    query-rewrite-enabled: true
    query-rewrite-history-size: 6   # 参与改写的最近历史条数上限（控制 token 成本）

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Chroma 向量库（加速副本，与 MySQL 双写留存；服务不可用时自动降级 MySQL 余弦检索）
chroma:
  base-url: http://127.0.0.1:8000
  collection-name: kb_chunks
  # 命名空间：必须用 Chroma 原生命名空间（默认 default_tenant/default_database）。
  # 不要用 Spring AI 默认的 SpringAiTenant —— 它在本地 Chroma 0.5.x 上不存在，
  # 且 Spring AI 初始化时的 getCollection 不认 Chroma 的 400 InvalidCollection，会导致初始化必失败。
  tenant: default_tenant
  database: default_database
  # 连接失败后的重试冷却秒数：冷却期内直接降级（不拖慢对话），冷却结束自动重连，
  # 「先起应用、后起 Chroma」无需重启应用即可自愈
  retry-interval-seconds: 60
  # 单批写入 Chroma 的文档数：受 Embedding 模型单次批量上限约束（DashScope text-embedding-v3 单次 ≤ 20 条，
  # 超了会 400 "batch size ... larger than 20"），不是 Chroma 的请求体积限制。默认 10 留一倍余量
  upsert-batch-size: 10

# 接口访问控制（可选）：留空 = 不校验（本地开发默认）。
# 设为非空值后，所有 /api/** 请求必须带 X-Api-Key 头（或 Authorization: Bearer）且与值一致才放行，
# 未带 / 错误一律 401。网页界面本身不在拦截范围内，但页面发起的 /api 请求会 401 ——
# 点顶栏「🔑 访问密钥」填入同一个值即可（存浏览器 localStorage，见 static/js/app.js 的 apiFetch）。
app:
  api-key: ${APP_API_KEY:}
  # SSE 传输层兜底（见 ChatController）
  sse:
    # 单条 SSE 连接最长存活时间（秒）。0=永不超时——会把「上游卡死」变成「连接与异步线程永久泄漏」，
    # 故默认给一个足够覆盖最长规划 + 多轮工具调用的有限值。
    timeout-seconds: 300
    # 心跳间隔（秒）。一轮对话在「路由→参数抽取→改写→检索」前置链上没有任何字节流出，
    # 反向代理（nginx 默认 proxy_read_timeout 60s）会当空闲连接切断，表现为「前端莫名断开」。
    # 0=关闭心跳。
    heartbeat-seconds: 15
  # 对话附件原文件落盘目录（图片 / 文档）：仅用于历史记录回看缩略图与下载，不进 LLM 上下文、不占 token。
  # 生产建议指向固定数据盘路径，例如 D:/data/my_agent/attachments
  attachment:
    dir: ./data/attachments

server:
  port: 8080

# 日志配置
logging:
  level:
    root: info           # 框架与第三方依赖：info（避免刷屏）
    org.luo: debug       # 本项目代码：debug（排查时改成 trace 可看到更细的链路日志）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
