spring:
  application:
    name: My_Agent

  # 导入独立提示词配置（agent.prompt.*），提示词集中外置，见 resources/prompts.yaml
  config:
    import: classpath:prompts.yaml

  # 启动时自动执行 schema.sql 建表（幂等：CREATE TABLE IF NOT EXISTS；
  # continue-on-error 让“为旧表补列”的 ALTER 在列已存在时不报错）
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:sql/schema.sql,classpath:sql/alter.sql
#      continue-on-error: true

  datasource:
    # 数据库 my_agent 不存在时，连接参数中的 createDatabaseIfNotExist 会自动创建
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      # API Key：推荐通过环境变量 OPENAI_API_KEY 注入，或在此直接填写
      api-key: ${OPENAI_API_KEY:sk-67e763f880894e47a4e5cc56be6e0615}
      # OpenAI 兼容的基础地址。
      # 使用 DeepSeek / 通义千问 / 本地 Ollama 等兼容服务时，改成对应地址即可，
      # 例如 DeepSeek: https://api.deepseek.com   本地 Ollama: http://localhost:11434
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        # 使用的模型 ID，例如 gpt-4o-mini / gpt-4o / deepseek-chat
        model: qwen3.7-plus
      # 知识库（RAG）向量化：与 chat 共用上方的 api-key / base-url（OpenAI 兼容的 /embeddings 端点）。
      # 未配置/调用失败时对话不受影响（知识库检索静默降级），仅「添加知识」会明确报错。
      embedding:
        # 通义千问兼容模式的向量模型（text-embedding-v3/v2/v1）；OpenAI 官方用 text-embedding-3-small
        model: text-embedding-v3

  # 多模态视觉识别：图片上传后由 VisionService 单独调此模型把图片转成文本 caption，再注入对话上下文。
  # 复用 spring.ai.openai.api-key / base-url，不重复配置 key 与端点。
  # dashscope OpenAI 兼容 /chat/completions 端点支持的模型：qwen-vl-plus（通用）/ qwen-vl-ocr（OCR 专用）等。
#  agent.vision.model 默认 qwen-vl-plus（见 VisionProperties），可通过如下键覆盖：
#  agent:
#    vision:
#      model: qwen-vl-plus
#      max-image-bytes: 10485760   # 单图 10MB 上限，超出返回「图片过大」占位
#      timeout-seconds: 30

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Chroma 向量库（加速副本，与 MySQL 双写留存；服务不可用时自动降级 MySQL 余弦检索）
chroma:
  base-url: http://127.0.0.1:8000
  collection-name: kb_chunks

# 接口访问控制（可选）：留空 = 不校验（本地开发默认，行为与原先一致）；
# 配置后所有 /api/** 请求必须带 X-Api-Key 头且与值一致才放行（静态前端页面不受影响），
# 用于把服务暴露到局域网/公网时防他人直接调用 SQL 工具或白嫖 LLM Key。
# 推荐通过环境变量注入：set APP_API_KEY=your-key（PowerShell）/ export APP_API_KEY=your-key（bash）
app:
  api-key: ${APP_API_KEY:}

server:
  port: 8080

# 日志配置：输出全部级别（TRACE 是最低级别，涵盖 TRACE/DEBUG/INFO/WARN/ERROR）
logging:
  level:
    root: info           # 全局所有框架与业务代码都输出
    org.luo: debug        # 本项目代码显式设为 trace，确保自定义日志全量输出
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"


