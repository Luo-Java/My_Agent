spring:
  application:
    name: My_Agent

  # 独立提示词(prompts.yaml) + 本地私有配置(application-local.yaml，含口令与 API Key，已 gitignore)
  config:
    import: classpath:prompts.yaml, optional:file:./application-local.yaml, optional:file:./config/application-local.yaml

  # DDL 由人工在 mysql cli 执行 sql/schema.sql(建表)与 alter.sql(补列)；需自动建表时取消下面注释
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:sql/schema.sql,classpath:sql/alter.sql
#      continue-on-error: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB

  # 静态资源禁用浏览器缓存，否则改完前端需 Ctrl+F5 才生效；生产开缓存时删掉本段
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

  datasource:
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    # 口令由 application-local.yaml 或环境变量 DB_PASSWORD 注入，不进仓库
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      # API Key 由 application-local.yaml 或环境变量 OPENAI_API_KEY 注入，不进仓库
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      timeout: 60s
      max-retries: 1
      chat:
        model: qwen3.7-flash-2026-07-15
      # RAG 向量化，与 chat 共用 api-key/base-url；换模型会使已入库向量失效，需重传或 rechunk
      embedding:
        model: qwen3.7-text-embedding

    # MCP 客户端(官方 starter)：这里不声明任何 server，默认即不接入。
    # 要接 server 把连接配置写进 application-local.yaml(已 gitignore)；命令用绝对路径，禁用 npx。
    mcp:
      client:
        enabled: true
        name: my-agent
        version: 1.0.0
        type: sync
        request-timeout: 15s
        toolcallback:
          enabled: true
        # stdio:
        #   connections:
        #     <server 名>:
        #       command: <可执行文件绝对路径>
        #       args: [<server 入口 js>, <沙箱根目录>]

# 智能体平台自身配置。前缀必须是顶层 agent.*(@ConfigurationProperties)，历史上曾缩进错挂到 spring.agent.* 整段失效
agent:
  # 多模态视觉识别：图片转 caption 注入对话。model 未配置时回退 VisionProperties.DEFAULT_MODEL
  vision:
    model: qwen-image-2.0-pro-2026-06-22
    max-image-bytes: 10485760   # 单图上限，超出返回「图片过大」占位
    timeout-seconds: 30

  # 会话记忆窗口(MemoryProperties)
  memory:
    recent-tokens: 4000       # 原文预算(按字符数近似)，超出由滚动摘要接管
    min-keep-messages: 2      # 至少保留的最近消息条数，防历史窗口塌缩变空(0=关闭)
    max-message-chars: 4000   # 单条消息进上下文前的字符上限，超出截断(0=不截断)

  # 规划步骤间产物传递(PlannerProperties)：给「前驱产出拼进下一步」装上限，防多步长产出无界累积击穿上下文
  # 实际配额 = min(upstream-max-chars, upstream-total-chars / 前驱个数)；两个都必须为正(不支持关闭)
  # 截断会保留前段并追加省略标注 + WARN，不静默；只影响注入下一步的输入，不影响落库与最终回复
  planner:
    upstream-max-chars: 4000     # 单个前驱产出注入下一步的字符上限
    upstream-total-chars: 12000  # 全部前驱产出合计上限，按前驱个数均分
    isolate-middle-steps: true   # 中间步骤(非首层非末步)不注入长期记忆(core_facts/summary)，避免被别的话题的摘要带偏

  # 线上回答自评(SelfEvalProperties)：让模型给刚产出的回答打个 1~5 分，落 agent_trace.self_eval_*。
  # 补的是「可观测面板只能回答跑成没跑成、快不快，回答对不对在线上没有信号」这个缺口。
  # 默认关闭 —— 自评是一次额外的模型往返、按轮计费，默认打开等于给每条对话悄悄加一笔成本。
  # 注意「默认关闭」不等于「零调用」：用户点踩时会对那一轮强制自评一次(不看 enabled / sample-rate)，
  # 因为那是用户明确发出信号之后才发生的，一次调用有明确目的。详见 SelfEvalService 类注释。
  # 采样判定由 traceId 哈希决定(不是随机数)，同一轮重放结论一致，便于复现「这轮为什么没被评到」。
  # 未自评的轮次 self_eval_score 留 NULL，面板按「未自评」单独计数 —— 与「评了低分」分开，不混算。
  self-eval:
    enabled: false               # 是否开启常规按比例自评(点踩强制自评不受此项约束)
    sample-rate: 0.1             # 采样比例 0~1(约每 10 轮评 1 轮)；越界会被夹到区间内并记 WARN
    min-answer-chars: 80         # 回答短于此长度不自评(寒暄/短确认没有可评内容)
    max-answer-chars: 2000       # 送进自评提示词的回答截断长度(自评只需判断是否答到点上)
    low-score-threshold: 3       # 面板把 score <= 该值的轮次列为「低分」(只影响展示口径)

  # 提示词回归评测(EvalProperties)：跑固定用例集断言路由/规划决策，改完 prompts.yaml 跑一批并和上一批对比
  # 用例集位置用 Spring Resource 语法；想免重编译调试可改成 file:./eval-cases.yaml
  eval:
    cases-file: classpath:eval-cases.yaml
    timeout-seconds: 60         # 单用例超时，超时记该条失败而不拖垮整批(被测调用自身没有 per-request 超时)

  # 提示词改动门禁(PromptGateProperties)：把「改了 prompts.yaml 到底变好还是变差」从靠手感变成有结论，
  # 并让它在改动发生的那一刻就被看见 —— 算 prompts.yaml 的内容指纹，与最近一次快照比对；
  # 不一样就留一条 PENDING 快照(零模型调用)，可由 POST /api/eval/gate 或 auto-run 触发验证。
  # enabled 默认 true：指纹比对不花钱，没理由关。auto-run 默认 false：跑批=真实模型调用，必须显式开。
  prompt-gate:
    enabled: true              # 总开关：关掉则既不比对指纹、也不记录快照
    auto-run: false            # 检测到变更时是否自动跑批(开启后启动阶段会发起一次真实模型调用)
    fail-on-broken: true       # 出现 broken(上批过、本批败)是否判为不通过；false=只记录

  # 定时任务(ScheduleProperties)：把「一句话 + 一个周期」变成自动执行的对话(每周学情报告/每月成绩分析)。
  # 触发方式是「轮询表」而非内存定时器：新增/修改/删除立即生效、重启自动恢复，代价是可能重复触发，
  # 故执行前用 next_run_at 做 CAS 抢占，同一时刻只有一个执行者。
  schedule:
    enabled: true              # 调度器总开关(关掉后不再扫描，已有任务定义保留)
    poll-interval-ms: 30000    # 轮询间隔(毫秒)；它决定「最坏晚多久执行」，默认 30 秒
    max-per-tick: 3            # 单轮最多执行几个到期任务，防同一时刻堆积把模型额度打满
    max-result-chars: 500      # 结果摘要落库与通知正文的截断长度(全文在承载会话里)

  # 通知外发(NotifyProperties)：把落库的通知再往站外推一份(钉钉/企业微信机器人文本消息)。
  # 默认不外发 —— webhook-url 为空时只落库、由前端轮询展示，不产生任何外部请求。
  # webhook-url 属敏感信息(内含 access_token)，与 API Key 同处置：写 application-local.yaml 或环境变量。
  notify:
    webhook-url: ${NOTIFY_WEBHOOK_URL:}   # 为空=不外发；填了则低于 min-level 的通知仍只落库
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    min-level: WARN            # 最低外发级别(INFO/WARN/ERROR)：INFO 全量外发会把群刷爆，等于把告警变噪声

  # 工具审批闸门(ToolApprovalProperties)：声明「哪些工具执行前要先问过用户」。
  # 背景：工具调用发生在模型内部，此前一路绿灯 —— 查库/画图/转交一键就执行，用户看不到「要干什么」也喊不停。
  # 默认 enabled=false 且清单为空 ⇒ 不包装任何工具，行为与不装这套机制完全一致。
  # 开启方式：enabled=true + 在 tools 里列出要拦的工具名(与 agent.tools_json 白名单同名)。
  # 例：tools: [query, call_agent] —— 把只读 SQL 与外发子任务压到用户点头之后。
  # 粒度是「会话 × 工具」：批准一次在本会话内持续有效(expire-minutes 后自动回到待确认)，不逐次打断。
  tool-approval:
    enabled: false             # 总开关；关掉时连一次额外查询都没有
    tools: []                  # 需要审批的工具名清单；例 [query, call_agent, handoff_agent]
    expire-minutes: 30         # 一次授权的有效期(分钟)；0=永不过期。只作用于「已批准」，「已拒绝」一票到底

  # 教务模块(EduProperties)：各 /api/edu/**/list 下拉选项接口的返回上限。
  # 这些接口语义是「返回全部可选项」，原本 SQL 层没有上界 —— score 的 selectOptions 要 join 5 张表
  # 再 concat 拼文案，在 5 万行数据下全量装载既慢又占内存。超出上限时截断并留 WARN（不静默）。
  edu:
    options-max-rows: 500

  # 成本配额(QuotaProperties)：给单个用户的「当日 token 消耗」装上界，防一个账号把额度烧光。
  # 默认关闭 —— 关着时闸门完全短路(不查库、不判断)，行为与不配这一节完全一致。
  # 口径：agent_trace(回答+工具循环) + llm_usage(路由/抽取/改写/规划/视觉/记忆合并等裸调用)，
  #      用户归属靠 JOIN conversation 判定(两表都没有 user_id)，因此「无会话的调用」不计入任何人的配额。
  # 超限表现：入口直接拒绝并说明「已用多少/上限多少/何时重置」，不静默降级(不换成小模型、不悄悄截断历史)。
  # 已知边界：检查在每轮开始前，单轮用量无法预知故可能小幅超出；/api/eval/** 跑批不在闸门覆盖内。
  quota:
    enabled: false             # 是否启用配额闸门
    daily-tokens: 2000000      # 每用户每自然日 token 上限(默认 200 万，约合 400~1000 轮普通对话)
    warn-ratio: 0.9            # 预警比例：达到即在流里播一条提示，但不拦截
    exempt-admins: true        # 豁免 ADMIN(否则管理员把额度用满后无法再通过界面调回配额)

  # 内容安全护栏(SafetyProperties)：对话链路的输入/输出侧基础护栏，按正则规则命中拦截。
  # 默认关闭 —— 关着时两侧完全短路(不编译规则、不扫文本)，行为与不配这一节完全一致。
  # 与「提示词里写安全要求」的区别：那是提示词行为工程(模型不照做就不生效)，这里是平台侧可确定执行的判定。
  # 拦截口径(不静默降级)：输入命中→明确拒绝(同步 422 / 流式 error 事件，本轮零模型调用)；
  #                       输出命中→明确替换为 blocked-message 并落 WARN(不假装成功、不悄悄改内容)。
  # 已知边界：正则只是字面/模式匹配，不是语义审核，换个说法即可绕过；要语义级审核需接专门的内容审核服务。
  # 规则只写进配置、命中日志不落用户原文(避免被拦内容二次留存进日志)。
  safety:
    enabled: false             # 是否启用护栏
    max-input-chars: 0         # 单条用户输入字符上限(0=不限)；超限按输入侧拦截同一口径处理
    blocked-message: 该内容不符合使用规范，已被安全策略拦截
    input-patterns: []         # 输入侧正则规则(任一命中即拒绝)。示例：["(?i)\\brm\\s+-rf\\s+/"]
    output-patterns: []        # 输出侧正则规则(任一命中即替换正文)。示例：["(?i)sk-[a-zA-Z0-9]{20,}"]

  # 数据侧脱敏(PiiProperties)：在「持久化边界」把手机号 / 身份证 / 邮箱 / 银行卡遮住中段，默认开启。
  # 三处同时生效、共用一个开关：chat_message 正文、agent_trace 追踪留档、应用日志(见 logback-spring.xml 的 %pii)。
  # 为什么只有一个开关：feedback.user_input(取自 chat_message)要逐字匹配 agent_trace.user_message，
  #   两处若可分别开关，匹配会静默失效(表现为「转用例偶尔失败」且只留一句 WARN)。一致性由结构保证。
  # 唯一副作用：chat_message 脱敏后会被读回、注入下一轮上下文 ⇒ 模型此后看不到完整号码(只看到 138****8000)。
  #   工具调用与检索都在脱敏之前执行完毕，不受影响。关掉它 = 明文落库，仅在业务需要模型复述完整号码时才关。
  pii:
    enabled: true              # false = 三处全部短路

  # 并行评审(ReviewProperties)：会话开「⚖ 评审」后，本轮由多个候选智能体并行作答、再由裁决者综合成最终答案。
  # 候选由 LLM 按「谁最适合回答这个问题」从智能体库里选；会话若已绑定智能体则固定占一个候选位。
  # 不足 2 个候选时明确播报原因并回退普通对话 —— 不静默降级成单模型回答。
  # 成本约为 (候选数 + 1) 次普通对话；候选答案只走 SSE 展示、不进会话记忆(进记忆的只有综合结论)。
  review:
    candidates: 3              # 候选数量(含被绑定的智能体)
    max-candidates: 5          # 候选数量硬上限(每个候选都是一次真实模型调用)
    timeout-seconds: 90        # 单候选作答等待上限；超时按弃权处理并记 WARN，不拖垮整轮

  # 跨会话搜索(CrossSessionProperties)：会话开「🔎 跨会话」后，在本人其他会话的历史消息里做关键词召回并注入。
  # 为什么是关键词而非向量：会话消息逐轮写入，走向量检索等于每条消息多一次 embedding 调用 + 一套副本维护链路，
  # 且会与知识库块(kb_chunk)的向量空间互相干扰；代价是召回质量受限于提词质量与字面匹配(明确接受的边界)。
  # 归属隔离靠 JOIN conversation(user_id)，并强制排除当前会话(当前会话已在记忆窗口里)。
  # 阈值告警与周期报告(AlertService)：把可观测面板里「要人主动去看」的指标变成越线主动推(落 notification 表)。
  # 三道防噪：样本不足不判定(min-sample)、同一项冷却期内不重报(cooldown-minutes)、空窗口不发报告。
  # 收件人 = 全部 ADMIN；一个都查不到时改为广播并记 WARN(告警没人收到比广播更糟)。
  alert:
    enabled: true
    window-days: 1              # 告警看「现在怎么样」，不是「这周平均怎么样」
    min-sample: 10              # 低于该轮次不做判定(小流量下 1 次失败就是 33% 成功率)
    min-success-rate: 0.90      # 成功率下限(0~1)
    max-avg-elapsed-ms: 15000   # 平均耗时上限(毫秒)
    max-low-score-count: 5      # 低分自评轮次上限(低分阈值复用 agent.self-eval.low-score-threshold)
    cooldown-minutes: 60        # 同一项告警的冷却期(指标是持续状态，每轮重报会把通知面板刷满)
    check-interval-ms: 600000   # 检查间隔(毫秒)；由 @Scheduled 占位符直接读取，不进 AlertProperties
    report-enabled: true
    report-cron: "0 0 9 * * *"  # 周期报告 cron(默认每天 09:00)；同上，由 @Scheduled 占位符直接读取
    report-days: 1

  cross-session:
    enabled: true              # 能力总开关(真正的启用条件是「本开关开 且 会话开关开」)
    recall-limit: 50           # SQL 层候选条数上限(先粗拉再在 Java 侧定型，避免大表无界扫描)
    top-k: 3                   # 最终注入上下文的条数
    max-keywords: 8            # 检索词个数上限(含「同义说法」，故比纯原词提词时要多)
    snippet-chars: 300         # 单条召回内容注入与展示的截断长度
    semantic-rerank: true      # 用精排对召回候选做语义重排(阈值复用 agent.rag.rerank-min-score)；关掉或精排不可用则退回命中词数排序

  # 失控刹车(ToolCallProperties)：给 Spring AI 默认无限工具循环装三道刹车，防死循环/重复调用/单轮烧穿。
  # 三道都是「软刹车」——不抛错，而是把「停止调工具、基于已有信息作答」追加进 system，让模型用已查到的
  # 中间结果给结论。硬中断会把这轮已花掉的调用结果全丢掉，还得从头再问一遍（且下一轮仍撞同一个上限）。
  # 代价：软刹车不是硬上限，刹车后仍会多一次模型调用（规划模式下每个被刹住的步骤各一次）。
  # 触发会写 WARN 日志（含 traceId，可在服务端日志检索整轮链路）并经进度通道播报，不静默；暂不落库。
  tool-call:
    max-iterations: 10        # 模型往返轮数硬顶，覆盖「查表→查数→画图」这类合理长链，只兜底真死循环
    repeat-threshold: 3       # 连续 N 次调同名工具同参即判原地打转、软刹车(基于已有信息作答)
    round-budget-tokens: 0    # 单轮累计 token 上限(0=不启用)。口径=agent_trace.total_tokens(工具循环内每次
                              # 调用 + 规划模式跨步骤累加)；与 agent.quota(用户×自然日)是两个维度：
                              # 配额拦「一天烧太多」，这里拦「一轮烧太多」——多步规划可一轮烧穿当日额度。

  # RAG 检索与精排(RagProperties)：粗排召回→精排→编号注入。精排走 DashScope 原生 text-rerank，复用 openai.api-key
  rag:
    rerank-enabled: true
    rerank-model: gte-rerank-v2
    rerank-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    rerank-min-score: 0.20    # 精排相关度下限(0~1)
    recall-k: 20              # 粗排召回候选数
    top-k: 3                  # 注入提示词的资料条数
    recall-min-score: 0.10    # 召回向量余弦下限(放宽档)
    min-score: 0.25           # 精排不可用时的余弦下限(严格档)
    timeout-seconds: 5
    fallback-max-chunks: 2000 # Chroma 不可用时回退 MySQL 的扫描上限，防无界扫描 OOM
    query-rewrite-enabled: true
    query-rewrite-history-size: 6   # 参与指代消解的历史条数上限
    # 混合检索：向量一路 + 关键词一路，两路用 RRF(只比名次，免疫两路分数尺度差异)融合后再交精排。
    # 关键词一路只在精排可用时参与 —— 融合分不是相似度，离开精排就只能退回纯向量(降级路径要的是行为可预期)。
    keyword-recall-enabled: true
    keyword-recall-k: 20             # 关键词路候选数(与 recall-k 同量级，融合后统一收敛到 recall-k)
    keyword-recall-scan-cap: 2000    # 关键词 LIKE 查询的 SQL 候选上限(有界，防 TEXT 列无界扫描)
    rrf-k: 60                        # RRF 常数：越大越强调「两路都命中」的共识

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Chroma 向量库(加速副本，MySQL 双写；不可用时降级 MySQL 余弦检索)
chroma:
  base-url: http://127.0.0.1:8000
  collection-name: kb_chunks
  # 必须用 Chroma 原生命名空间；Spring AI 默认的 SpringAiTenant 在本地 0.5.x 不存在，会导致初始化必失败
  tenant: default_tenant
  database: default_database
  retry-interval-seconds: 60   # 连接失败后的重试冷却，先起应用后起 Chroma 可自愈
  upsert-batch-size: 10        # 单批写入条数，受 embedding 模型单次批量上限约束(留一倍余量)

# 接口访问控制：登录鉴权是全项目唯一的接口闸门
#   jwt —— 用户登录态，/api/** 除 /api/auth/login 外都要带 Authorization: Bearer <token>
# 旧的服务级密钥（app.api-key / APP_API_KEY → ApiKeyInterceptor）已移除：它与登录流程冲突 ——
# 启用后连 POST /api/auth/login 都会被拒（前端登录请求只带 Authorization，不带 X-Api-Key），
# 用户根本进不来；而 /api/** 已由 JWT 覆盖，机器调用同样需要先登录，该闸门不再提供额外保护。
app:
  jwt:
    enabled: true            # 强制登录；置 false 则 /api/** 不再校验 token（回到引入用户系统前的行为）
    # 签名密钥**在这里不写值**。原因：写一个内置默认值 = 把签名密钥随源码一起分发，
    # 拿到源码的人可以离线伪造任意账号（含 ADMIN）的 token，且从日志上看不出异常。
    # 来源二选一：环境变量 JWT_SECRET（openssl rand -hex 32），或 application-local.yaml（已 gitignore）的 app.jwt.secret。
    # 两处都没配（或不足 32 字节）时 JwtTokenService 生成随机密钥并打 WARN —— 仅够本地开发，重启后已签发 token 全失效。
    # 注意：**不要在这里留空占位符**（secret: ""）—— 空串会覆盖 application-local.yaml 里的值，等于把密钥改没。
    # 要用环境变量注入就写 secret: ${JWT_SECRET}（占位符解析不到会启动失败，比静默回落到随机密钥更早暴露）。
    expire-minutes: 720      # token 有效期（分钟）
    issuer: my-agent
    bootstrap-admin: true    # 启动时若 sys_user 表为空则创建初始管理员（否则首次无法登录）
    bootstrap-username: admin
    bootstrap-password: ${JWT_BOOTSTRAP_PASSWORD:admin123}   # 仅初始口令，登录后应立即修改
  sse:
    timeout-seconds: 300     # 单条 SSE 连接最长存活(0=永不超时，会泄漏)
    heartbeat-seconds: 15    # 心跳间隔，防反向代理 60s 空闲断连(0=关闭)
  attachment:
    dir: ./data/attachments  # 附件落盘目录，生产建议指向固定数据盘

server:
  port: 8080

logging:
  level:
    root: info
    org.luo: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
