<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="My_Agent —— 多智能体协作平台：规划、检索、数据分析与工具调用" />
    <title>My_Agent · 多智能体协作平台</title>
    <link rel="stylesheet" href="/css/landing.css" />
    <!-- 右上角登录按钮与登录弹框的样式（auth- 前缀，不与 landing.css 的变量/类名交叉） -->
    <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
<!-- 背景层：粒子网络画布 + 网格 + 扫描线 -->
<canvas id="net"></canvas>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<div class="shell">
    <header class="nav rise d1">
        <div class="brand">
            <span class="brand-mark">
                <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z" fill="#04101f" />
                </svg>
            </span>
            <span>My_Agent</span>
        </div>
        <div class="nav-right">
            <span class="nav-status">
                <span class="dot"></span>
                <span>服务就绪</span>
            </span>
            <!-- 登录态挂载点：未登录渲染「登录」按钮（点击弹框，不跳页），已登录渲染用户名 + 用户管理 + 退出。
                 内容与事件都在 js/auth.js，首页本身不含任何登录逻辑。 -->
            <span data-auth-nav></span>
        </div>
    </header>

    <main class="hero">
        <span class="badge rise d2"><i></i>Spring Boot 4.0.7 · Spring AI 2.0.0</span>

        <h1 class="rise d3">多智能体协作平台</h1>

        <p class="sub rise d4">
            <span id="typed"></span><span class="caret"></span>
        </p>

        <div class="cta-row rise d5">
            <!-- 两个入口都是受限页，都加 data-auth-required：点击时先确认登录态（未登录就地弹框、
                 已登录先校验 token 仍有效），确认通过才跳转 —— 见 js/auth.js 的 guardNavigation。
                 控制台进入与刷新都落在空白欢迎页，不自动打开最近会话（见 app.js onMounted）。 -->
            <a class="cta" href="/chat.html" data-auth-required>
                进入控制台
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h13M13 6l6 6-6 6" />
                </svg>
            </a>
            <a class="cta-secondary" href="/edu.html" data-auth-required>
                教务系统
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h13M13 6l6 6-6 6" />
                </svg>
            </a>
            <p class="hint">或按 <kbd>Enter</kbd> 直接进入</p>
        </div>

        <section class="cards">
            <article class="card rise d5">
                <div class="card-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="2.5" width="6" height="5" rx="1.5" />
                        <rect x="2.5" y="16.5" width="6" height="5" rx="1.5" />
                        <rect x="15.5" y="16.5" width="6" height="5" rx="1.5" />
                        <path d="M12 7.5v4M5.5 16.5v-2.5h13v2.5" />
                    </svg>
                </div>
                <h3>智能规划</h3>
                <p>任务拆成执行图逐步推进，缺参数先澄清再动手</p>
            </article>

            <article class="card rise d6">
                <div class="card-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4.5 4.5h9l4 4v11h-13z" />
                        <path d="M13.5 4.5v4h4" />
                        <path d="M8 13h6M8 16.5h4" />
                    </svg>
                </div>
                <h3>知识检索</h3>
                <p>多路召回加精排，作答带引用来源可追溯</p>
            </article>

            <article class="card rise d7">
                <div class="card-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3.5 20.5h17" />
                        <path d="M7 20.5v-6M12 20.5v-10M17 20.5v-4" />
                    </svg>
                </div>
                <h3>数据分析</h3>
                <p>自然语言转只读查询，结果直接出图</p>
            </article>

            <article class="card rise d8">
                <div class="card-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="9" rx="2" />
                        <path d="M8 10V6M16 10V6M9.5 14.5h5" />
                    </svg>
                </div>
                <h3>工具生态</h3>
                <p>本地工具与 MCP 远端工具，同一个注册表装配</p>
            </article>
        </section>
    </main>

    <footer class="foot rise d8">
        <span>多智能体协作 · 双层记忆 · 向量加速检索 · 流式输出</span>
        <span class="foot-stack">
            <span>Spring AI</span>
            <span>Chroma</span>
            <span>MyBatis-Plus</span>
            <span>MCP</span>
        </span>
    </footer>
</div>

<!-- 登录态模块：自动渲染上面的 data-auth-nav 挂载点，并拦截 data-auth-required 链接 -->
<script src="/js/auth.js"></script>
<script src="/js/landing.js"></script>
</body>
</html>
